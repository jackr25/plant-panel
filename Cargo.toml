[workspace]
resolver = "3"
members = ["crates/plant-icd", "crates/plantd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jackrathert/plant-panel"

[workspace.dependencies]
plant-icd = { path = "crates/plant-icd" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
