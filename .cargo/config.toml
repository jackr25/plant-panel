# Raspberry Pi 5 (64-bit OS) target. A static musl binary runs on any aarch64 Linux,
# whatever its glibc, and links with the rust-lld that ships with rustup: no cross
# toolchain to install.  cargo build --release --target aarch64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
pi = "build --release --target aarch64-unknown-linux-musl -p plantd"
