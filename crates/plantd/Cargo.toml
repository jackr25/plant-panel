[package]
name = "plantd"
description = "Soil moisture collector daemon: polls soil nodes, stores samples, forecasts watering"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plant-icd.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = { version = "0.4", features = ["std"] }
tiny_http = "0.12"
mdns-sd = { version = "0.21", default-features = false }
